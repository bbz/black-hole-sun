# Fails a push or pull request that adds game files, binaries or decompiler output anywhere in the
# tree (tools/check_release.py). The release repo is also checked with --history, every blob it
# has ever had.
#
# Actions are pinned by SHA, as in authorship.yml: a tag can be repointed, a SHA can't.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -I tools/check_release.py . ${{ github.repository == 'bbz/black-hole-sun' && '--history' || '' }}
